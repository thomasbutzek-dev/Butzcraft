name: butzcraft

services:
  app:
    image: ghcr.io/thomasbutzek-dev/butzcraft:stabilization
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      ALLOWED_ORIGINS: https://butzcraft.de,https://www.butzcraft.de,https://play.butzcraft.de
      ENABLE_REMOTE_SAVES: "false"
      WEBSITE_HOSTS: butzcraft.de,www.butzcraft.de
      GAME_ORIGIN: https://play.butzcraft.de/
      SITE_ADMIN_USER: ${SITE_ADMIN_USER:-admin}
      SITE_ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-}
      SITE_CONTENT_DIR: /app/site-content
      STATISTICS_DIR: /app/statistics
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-kontakt@butzcraft.de}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-kontakt@butzcraft.de}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-kontakt@butzcraft.de}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    expose:
      - "3000"
    volumes:
      - butzcraft_saves:/app/saves
      - butzcraft_site_content:/app/site-content
      - butzcraft_statistics:/app/statistics
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.routers.butzcraft.rule: Host(`butzcraft.de`) || Host(`www.butzcraft.de`) || Host(`play.butzcraft.de`)
      traefik.http.routers.butzcraft.entrypoints: websecure
      traefik.http.routers.butzcraft.tls: "true"
      traefik.http.routers.butzcraft.tls.certresolver: letsencrypt
      traefik.http.services.butzcraft.loadbalancer.server.port: "3000"

volumes:
  butzcraft_saves:
  butzcraft_site_content:
  butzcraft_statistics:
