<!DOCTYPE html>
<html>
<body>
<canvas id='c' width='1024' height='1024'></canvas>
<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    
    const drawTile = (tx, ty, drawFunc) => {
        const actualX = (tx % 16) * 64;
        const actualY = Math.floor(tx / 16) * 64;
        ctx.save(); ctx.translate(actualX, actualY);
        drawFunc(ctx);
        ctx.restore();
    };

    const pixelMapDraw = (c, mapStr, palette) => {
        for (let y = 0; y < 16; y++) {
            for (let x = 0; x < 16; x++) {
                const char = mapStr[y][x];
                if (palette[char]) {
                    c.fillStyle = palette[char];
                    c.fillRect(x * 4, y * 4, 4, 4);
                }
            }
        }
    };

    drawTile(53, 0, (c) => {
        const sidePalette = { '1': '#866043', '2': '#6e4c33', '3': '#95684d', '4': '#7f7f7f', 'G': '#70b345', 'D': '#4a802b', 'S': '#437326' };
        const sideMap = [
            'GGGGGGGGGGGGGGGG', 'GGDDGGGGGGGGDDGG', 'DGDSSSGDGGDDGSSS', 'SSGS1SSSGDSSGS1S',
            '1SS1111SSG11SS11', '11111411SS122211', '1311141113112113', '3312211133111111',
            '1112221311141122', '1211211112144111', '1111113311114113', '2221133312221113',
            '1214113111211211', '1144411221112221', '1314112221311211', '3311131213311111'
        ];
        pixelMapDraw(c, sideMap, sidePalette);
    });

    const data = ctx.getImageData(320, 192, 64, 64).data;
    let sum = 0;
    for(let i=0; i<data.length; i++) sum += data[data.length-1];
    document.body.innerHTML += '<h1 id="result">' + data[0] + ',' + data[1] + ',' + data[2] + ',' + data[3] + '</h1>';
</script>
</body>
</html>
