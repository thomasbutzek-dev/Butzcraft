<!DOCTYPE html>
<html>
<head>
    <title>Tile Test - Phase 1</title>
    <style>
        body { background: #222; color: white; font-family: monospace; display: flex; gap: 40px; padding: 40px; flex-wrap: wrap; }
        .tile-box { text-align: center; }
        .tile-box canvas { border: 2px solid #555; image-rendering: pixelated; }
        h2 { margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="tile-box">
        <h2>Tile 0 – Gras Oben</h2>
        <canvas id="tile0" width="64" height="64" style="width:256px;height:256px;"></canvas>
    </div>
    <div class="tile-box">
        <h2>Tile 53 – Gras Seite</h2>
        <canvas id="tile53" width="64" height="64" style="width:256px;height:256px;"></canvas>
    </div>
    <div class="tile-box">
        <h2>Tile 1 – Erde (Unten)</h2>
        <canvas id="tile1" width="64" height="64" style="width:256px;height:256px;"></canvas>
    </div>

    <script>
        const pixelMapDraw = (c, map, palette) => {
            const pw = 64 / 16;
            for (let row = 0; row < map.length; row++) {
                for (let col = 0; col < map[row].length; col++) {
                    const ch = map[row][col];
                    if (palette[ch]) {
                        c.fillStyle = palette[ch];
                        c.fillRect(col * pw, row * pw, pw, pw);
                    }
                }
            }
        };

        // Tile 0 - Gras Oben
        {
            const c = document.getElementById('tile0').getContext('2d');
            const grassPalette = {
                '1': '#5B9C2E', '2': '#4E8C25', '3': '#6BAD38',
                '4': '#3D7A1C', '5': '#52A028', '6': '#468B20'
            };
            const grassMap = [
                "1234512345123451", "3516234156234152",
                "2143651234516234", "5631243561243516",
                "4215634215634215", "1346521346521346",
                "6524136252413652", "3261456321456321",
                "1453261453261453", "5316425316425316",
                "2641532641532641", "4123654123654123",
                "6352146352146352", "1246531246531246",
                "3514263514263514", "2631425263142526"
            ];
            pixelMapDraw(c, grassMap, grassPalette);
        }

        // Tile 53 - Gras Seite
        {
            const c = document.getElementById('tile53').getContext('2d');
            const sidePalette = {
                'G': '#5B9C2E', 'D': '#4E8C25', 'S': '#3D7A1C',
                '1': '#8B6B4A', '2': '#7A5C3A', '3': '#6D4C33',
                '4': '#5C3D2E', '5': '#7F6040'
            };
            const sideMap = [
                "GGDDGGSGGGDDGGSG", "GDGSSGDGGDGSSGDG",
                "DSGGSSDGSGSSDGSS", "SGD1SSGD1GSSG1DS",
                "1S12S1S21S12S1S2", "2131213121312131",
                "1312412131124121", "3215131532151315",
                "1131221113122111", "5213113152131131",
                "1124315111243151", "3312114233121142",
                "1241531312415313", "2113214121132141",
                "1432115314321153", "3211432132114321"
            ];
            pixelMapDraw(c, sideMap, sidePalette);
        }

        // Tile 1 - Erde
        {
            const c = document.getElementById('tile1').getContext('2d');
            const browns = ['#8B6B4A', '#7A5C3A', '#6D4C33', '#7F6040', '#5C3D2E'];
            for (let x = 0; x < 64; x += 2) {
                for (let y = 0; y < 64; y += 2) {
                    c.fillStyle = browns[Math.floor(Math.random() * browns.length)];
                    c.fillRect(x, y, 2, 2);
                }
            }
            // Kleine Steinchen
            for (let i = 0; i < 8; i++) {
                c.fillStyle = ['#9E9E9E', '#8D8D8D'][Math.floor(Math.random() * 2)];
                c.fillRect(Math.random()*60+2, Math.random()*60+2, 4, 2);
            }
        }
    </script>
</body>
</html>
