<!DOCTYPE html>
<html>
<body>
<img id='atlas' src='' style='display:none;' />
<canvas id='c' width='64' height='64'></canvas>
<script type='module'>
    import { textureAtlas, atlasDataURL } from './js/blocks.js?v=20260413_5';
    const img = document.getElementById('atlas');
    img.src = atlasDataURL;
    img.onload = () => {
        const ctx = document.getElementById('c').getContext('2d');
        // Draw Tile 53
        const tx = 53;
        const actualX = (tx % 16) * 64;
        const actualY = Math.floor(tx / 16) * 64;
        ctx.drawImage(img, actualX, actualY, 64, 64, 0, 0, 64, 64);
        const data = ctx.getImageData(0,0,64,64).data;
        let isSolid = true;
        let p0 = data[0]+','+data[1]+','+data[2];
        for(let i=0; i<data.length; i+=4) {
            let p = data[i]+','+data[i+1]+','+data[i+2];
            if(p !== p0) isSolid = false;
        }
        document.body.innerHTML += '<h1 id="result">' + (isSolid ? 'SOLID COLOR' : 'TEXTURED') + '</h1>';
        // Check if top row is green
        let r0 = data[0], g0 = data[1], b0 = data[2];
        document.body.innerHTML += '<h2 id="colorTop">Top: ' + r0 + ',' + g0 + ',' + b0 + '</h2>';
        
        let bottomIdx = 63 * 64 * 4; // last row
        document.body.innerHTML += '<h2 id="colorBottom">Bottom: ' + data[bottomIdx] + ',' + data[bottomIdx+1] + ',' + data[bottomIdx+2] + '</h2>';
    };
</script>
</body>
</html>
